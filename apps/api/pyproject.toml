[project]
name = "agentforge"
version = "0.1.0"
description = "AgentForge — infrastructure for running, evaluating and improving AI agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "typer>=0.12",
  "rich>=13.7",
  "psutil>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
agentforge = "agentforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.pyrefly]
python-interpreter-path = "../../.venv/bin/python"
search-path = [
  "../../.venv/lib/python3.12/site-packages",
  "."
]
